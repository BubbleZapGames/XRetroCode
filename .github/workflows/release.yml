name: Package xretrocode

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job writes.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xretrocode
    steps:
      # No submodules: packaging and the unit tests don't need Mesen-GDB
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xretrocode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # A v1.2.3 tag must release version 1.2.3, or the .vsix name and the
      # version VS Code shows would disagree with the release.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: xretrocode-vsix
          path: xretrocode/*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xretrocode-vsix
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease \
            --notes "Install with \`code --install-extension $(cd dist && ls *.vsix)\`, or use **Install from VSIX...** in the Extensions view. Debugging needs mesen-gdb, which is installed separately: download it from https://github.com/BubbleZapGames/Mesen-GDB/releases."
